<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckOut de Compras</title>
    <style>
        /* Estilos básicos para deixar idêntico ao design da imagem */
        body {
            background-color: #72E1B5; /* Fundo verde-água */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .checkout-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #000;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            display: block;
            font-size: 18px;
            color: #000;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 25px; /* Bordas bem arredondadas como na foto */
            box-sizing: border-box;
            color: #757575;
        }

        .payment-label {
            font-size: 16px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        /* Estilização dos botões de pagamento */
        .btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            font-size: 18px;
            color: white;
            border: none;
            border-radius: 12px; /* Bordas arredondadas dos botões */
            cursor: pointer;
            font-weight: 500;
        }

        .btn-pix { background-color: #9C27B0; }      /* Roxo */
        .btn-dinheiro { background-color: #1A237E; } /* Azul escuro */
        .btn-vista { background-color: #4CAF50; }    /* Verde */
        .btn-parcelado { background-color: #E91E63; }/* Rosa choque */

        .result-box {
            margin-top: 25px;
            font-size: 16px;
            color: #000;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h1>CheckOut de Compras</h1>

        <!-- Campo: Preço do Produto -->
        <div class="input-group">
            <label for="preco">Preço do Produto (R$)</label>
            <input type="text" id="preco" placeholder="Ex:100,00">
        </div>

        <!-- Campo: Valor do Frete -->
        <div class="input-group">
            <label for="frete">Valor do Frete (R$)</label>
            <input type="text" id="frete" placeholder="Ex:15,00">
        </div>

        <!-- Seleção de Forma de Pagamento -->
        <div class="payment-label">Forma de Pagamento:</div>

        <button class="btn btn-pix">PIX(-10%)</button>
        <button class="btn btn-dinheiro">Dinheiro(-5%)</button>
        <button class="btn btn-vista">Cartão à Vista</button>
        <button class="btn btn-parcelado">Parcelado(+5%)</button>

        <!-- Área de exibição dos resultados -->
        <div class="result-box">
            <div>Forma: </div>
            <div>Total: </div>
        </div>
    </div>

</body>
</html>
